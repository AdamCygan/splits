# Testy po każdym pushu do main i w każdym pull requeście: typy, lint, testy jednostkowe i API,
# a na buildzie produkcyjnym e2e z dostępnością (axe). Wdrożenie robi Railway sam z gałęzi main,
# więc ten workflow niczego nie wdraża.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Domyślnie tylko odczyt repozytorium; akcje są przypięte do commitów (aktualizuje je Dependabot).
permissions:
  contents: read

# Nowy push do tej samej gałęzi przerywa poprzedni przebieg (liczy się tylko najnowszy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: splits_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/splits_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/splits_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Wersję pnpm bierze z pola packageManager w package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint
      - run: pnpm test
      - run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database splits_e2e'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      # Ślady (trace) nieudanych testów: pnpm exec playwright show-trace <plik>.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
