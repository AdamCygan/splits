# Ustawienia pnpm (jeden projekt, bez podpakietów).

# Skrypty instalacyjne uruchamiamy tylko dla zaufanych paczek, które ich potrzebują.
allowBuilds:
  esbuild: true
  # Wyświetla tylko komunikat o darowiznach.
  core-js: false

overrides:
  # Łatka bezpieczeństwa w zależności narzędzia (pnpm audit). Usuń, gdy drizzle-kit
  # sam przejdzie na poprawioną wersję.
  # esbuild <=0.24.2: dowolna strona może czytać serwer deweloperski (drizzle-kit > @esbuild-kit/core-utils).
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
