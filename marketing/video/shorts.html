<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pointhours shorts</title>
<!--
  Trzy pionowe shorty (1080×1920) o problemach, które rozwiązuje Pointhours:
    ?story=sprint   gdzie poszedł sprint (podział na typy pracy)
    ?story=pause    pilne przerwanie zadania (pauza, przełączenie, powrót, interwały)
    ?story=invoice  koniec miesiąca na B2B (raport godzin do faktury)
    ?story=review | pairing | meetings | extra | estimate | forgot | templates | summary
                    8 kolejnych historii we wspólnym schemacie (funkcja generic)
  Język: ?lang=en (domyślnie) albo ?lang=pl. Adres na planszy końcowej: ?url=pointhours.com
  (bez niego: „Link w bio”). Podgląd w przeglądarce: dodaj &play.
  Animacja jest deterministyczna: window.render(t) ustawia klatkę dla czasu t (s), shorts.py zapisuje MP4.
  Treść trzyma się bezpiecznej strefy (y 200–1480, x 64–940), bo dół i prawą krawędź zasłaniają przyciski platform.
-->
<style>
  @font-face { font-family: 'Brand Display'; src: url('../../src/assets/fonts/brand-display-core.woff2') format('woff2'); font-weight: 600 800; }
  @font-face { font-family: 'Brand Text'; src: url('../../src/assets/fonts/brand-text-core.woff2') format('woff2'); font-weight: 400 700; }
  :root {
    --ink: #14162b; --ink-2: #1d2040; --paper: #f5f6fa; --surface: #fff;
    --text: #14162b; --soft: #4a4e69; --faint: #646882; --line: #dcdfea; --muted: #eceef5;
    --on-ink-soft: #b3b7cc;
    --task: #3d3bf3; --review: #e8a33d; --pair: #0f9f86; --extra: #db4a7c; --meeting: #8a8fa8; --alert: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { background: var(--ink); color: #fff; font-family: 'Brand Text', sans-serif; -webkit-font-smoothing: antialiased; position: relative; }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  .display { font-family: 'Brand Display', sans-serif; font-weight: 760; letter-spacing: -0.025em; line-height: 1.02; }
  .kicker { font-weight: 700; font-size: 34px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--on-ink-soft); }
  .big { font-size: 104px; }
  .mid { font-size: 76px; }
  .word { display: inline-block; will-change: transform, opacity; }
  .hl-extra { color: #ff7aa8; } .hl-review { color: #f5be6a; } .hl-task { color: #9d9bff; }
  .ink-text { color: var(--text); }
  .soft { color: var(--soft); }

  #paper { background: var(--paper); transform: translateY(100%); }
  .card { background: var(--surface); border: 2px solid var(--line); border-radius: 36px; box-shadow: 0 4px 0 var(--line), 0 60px 90px -50px rgba(20,22,43,0.45); color: var(--text); overflow: hidden; }
  .dark-card { background: var(--ink-2); border-radius: 32px; color: #fff; }
  .h { font-family: 'Brand Display'; font-weight: 720; letter-spacing: -0.01em; }
  .muted { color: var(--soft); }

  /* timer */
  .timer { display: flex; align-items: center; gap: 26px; background: var(--ink); color: #fff; border-radius: 28px; padding: 26px 30px; }
  .play { width: 76px; height: 76px; border-radius: 50%; background: #fff; display: grid; place-items: center; flex: none; }
  .play svg { width: 30px; height: 30px; }
  .t-state { color: #b8bad0; font-size: 26px; }
  .t-name { font-weight: 650; font-size: 34px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock { font-family: 'Brand Display'; font-weight: 720; font-size: 56px; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .btn { display: inline-flex; align-items: center; gap: 12px; border-radius: 18px; padding: 16px 26px; font-weight: 700; font-size: 28px; }
  .btn-light { background: #fff; color: var(--ink); }
  .btn-ghost { border: 2px solid #4a4e69; color: #fff; }
  .chip { display: inline-flex; align-items: center; gap: 14px; border: 2px solid var(--line); border-radius: 999px; padding: 12px 26px 12px 14px; font-weight: 650; font-size: 28px; color: var(--text); background: var(--surface); }
  .chip i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 800; color: #fff; font-size: 22px; }
  .dot { width: 22px; height: 22px; border-radius: 50%; flex: none; display: inline-block; }

  table { width: 100%; border-collapse: collapse; font-size: 33px; }
  th { text-align: left; font-weight: 500; color: var(--soft); padding: 0 0 14px; font-size: 26px; }
  td { padding: 16px 0; border-top: 2px solid var(--line); }
  th:not(:first-child), td:not(:first-child) { text-align: right; }
  tr.hl td { background: rgba(232,163,61,0.18); }
  .lit { background: rgba(232,163,61,0.2); border-radius: 12px; }

  #cursor { position: absolute; left: 0; top: 0; width: 64px; height: 64px; z-index: 30; opacity: 0; filter: drop-shadow(0 6px 8px rgba(20,22,43,0.35)); }
  #ring { position: absolute; left: 0; top: 0; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 6px solid var(--task); opacity: 0; z-index: 29; }

  #endcard { background: var(--ink); transform: translateY(100%); }
  .end { position: absolute; left: 64px; right: 64px; top: 330px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 46px; }
  .logo-row { display: flex; align-items: center; gap: 28px; }
  .mark { width: 128px; height: 128px; }
  .wordmark { font-family: 'Brand Display'; font-weight: 790; font-size: 112px; letter-spacing: -0.035em; line-height: 1; }
  .tagline { font-size: 40px; color: var(--on-ink-soft); }
  .punch { font-size: 92px; max-width: 14ch; }
  .price { font-size: 38px; color: var(--on-ink-soft); }
  .cta { display: inline-flex; align-items: center; background: #fff; color: var(--ink); font-weight: 750; font-size: 46px; padding: 30px 60px; border-radius: 24px; }
  .endstrip { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; display: flex; gap: 6px; }
  .endstrip b { display: block; height: 100%; transform-origin: left center; }
</style>
</head>

  /* ------------------------------------------------------------- narzędzia */
  const $ = id => document.getElementById(id);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

  const eio = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

  const hms = s => {

    let x = path[0][1], y = path[0][2];
    for (let i = 1; i < path.length; i++) {
      const [t0, x0, y0] = path[i - 1], [t1, x1, y1] = path[i];
      if (t >= t0) { const k = eio(p(t, t0, t1)); x = lerp(x0, x1, k); y = lerp(y0, y1, k); }

      $('bstop').style.transform = t >= 11.1 && t < 11.3 ? 'scale(0.94)' : 'scale(1)';
      moveCursor(t, [[8.5, 700, 1300], [9.2, 200, 727], [10.5, 210, 760], [11.1, 400, 727], [11.6, 560, 860], [11.9, 800, 880], [12.6, 960, 1000]], [9.2, 11.1, 11.95], t >= 8.5 && t < 12.6);
      const td = eo(p(t, 12.6, 13.1));
      set(today, td, (1 - td) * 60);
      ['g1', 'g1a', 'g1b', 'g2'].forEach((id, i) => { $(id).style.opacity = eo(p(t, 13.0 + i * 0.3, 13.4 + i * 0.3)); });
      $('g1a').style.background = t > 14.4 && t < 15.6 ? 'rgba(61,59,243,0.08)' : 'transparent';
      $('g1b').style.background = t > 14.4 && t < 15.6 ? 'rgba(61,59,243,0.08)' : 'transparent';
      revealWords(outro.firstChild, t, 14.6, 0.06);
      endcard(t, END);
    }};
  }

  /* ==================================================== 3. INVOICE ====== */
  function invoice() {
    const D = 21, END = 16.4;
    const cal = add(ink, `
      <div style="width:220px;border-radius:30px;overflow:hidden;background:#fff;color:var(--text);text-align:center;box-shadow:0 30px 60px -30px rgba(0,0,0,0.6)">
        <div style="background:var(--extra);color:#fff;font-weight:800;font-size:40px;padding:12px 0;text-transform:uppercase">${S.month}</div>
        <div class="display" style="font-size:130px;padding:14px 0 20px">${S.day}</div>
      </div>`, 'left:64px;top:300px');
    const h1 = add(ink, `<p class="display big">${words(S.hook1)}</p>`, 'left:64px;top:640px;right:110px');
    const h2 = add(ink, `<p class="display big hl-review">${words(S.hook2)}</p>`, 'left:64px;top:880px;right:110px');
    const scrapStyle = [
      ['left:64px;top:300px', -4, 'font-family:ui-monospace,Menlo,monospace;background:#0d0f1f;color:#9be59b'],
      ['left:330px;top:480px', 3, 'background:#fff;color:var(--text)'],
      ['left:90px;top:660px', -2, 'background:#e7e6ff;color:var(--text)'],
      ['left:420px;top:820px', 4, 'background:#fff;color:var(--text)'],
      ['left:140px;top:960px', -6, 'background:#ffe58a;color:#3b2f00;font-family:\'Comic Sans MS\',cursive'],
    ];
    const scraps = S.scraps.map((s, i) => add(ink, `<div style="padding:26px 32px;border-radius:22px;font-size:36px;font-weight:650;${scrapStyle[i][2]};box-shadow:0 26px 50px -28px rgba(0,0,0,0.7)">${s}</div>`, scrapStyle[i][0]));
    const dig = add(ink, `<p class="display mid">${words(S.dig)}</p>`, 'left:64px;top:1150px;right:110px');
    const guess = add(ink, `<p class="display mid hl-review">${words(S.guess)}</p>`, 'left:64px;top:1340px;right:110px');

    const cap = add(paper, `<h2 class="display big ink-text">${words(S.caption)}</h2>`, 'left:64px;top:230px;right:110px');
    const card = add(paper, `
      <div class="card" style="padding:40px 44px 36px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:20px">
          <div><div class="h" style="font-size:46px">${S.cardHead}</div><div class="muted" style="font-size:28px;margin-top:6px">${S.cardMeta}</div></div>
          <span class="btn" id="bexport" style="background:var(--ink);color:#fff;font-size:28px;white-space:nowrap">⤓ ${S.export}</span>
        </div>
        <table style="margin-top:30px"><thead><tr>${S.cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
        <tbody>${S.rows.map((r, i) => `<tr id="ir${i}"><td style="max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
        <tr id="itot"><td style="font-weight:800">${S.total}</td><td style="font-weight:800">${S.totalSp}</td><td style="font-weight:800">${S.totalH} h</td></tr></tbody></table>
      </div>`, 'left:64px;top:430px;width:876px');
    const file = add(paper, `<span class="chip" style="font-size:32px;padding:16px 30px 16px 16px"><i style="background:var(--pair)">✓</i>${S.file}</span>`, 'left:64px;top:1230px');
    const outro = add(paper, `<p class="display" style="font-size:60px;color:var(--text)">${words(S.outro)}</p>`, 'left:64px;top:1340px;right:120px');

    return { duration: D, frame(t) {
      const c0 = eo(p(t, 0.05, 0.5));
      set(cal, Math.min(c0, 1 - p(t, 2.7, 3.0)), (1 - c0) * -40, 0.9 + c0 * 0.1, 0, -4 * c0);
      revealWords(h1.firstChild, t, 0.3); h1.style.opacity = 1 - p(t, 2.7, 3.0);
      revealWords(h2.firstChild, t, 1.1); h2.style.opacity = 1 - p(t, 2.7, 3.0);
      const b = vis(t, 3.0, 7.7);
      scraps.forEach((s, i) => {
        const k = eo(p(t, 3.1 + i * 0.28, 3.55 + i * 0.28));
        const wob = Math.sin((t - 3) * 2.2 + i) * 1.2;
        set(s, Math.min(k, b), (1 - k) * 90, 0.85 + k * 0.15, (i % 2 ? 1 : -1) * (1 - k) * 120, scrapStyle[i][1] + wob);
      });
      revealWords(dig.firstChild, t, 4.8, 0.06); dig.style.opacity = b;
      revealWords(guess.firstChild, t, 6.1); guess.style.opacity = b;

      paperIn(t, 7.6);
      revealWords(cap.firstChild, t, 8.0);
      const c = eo(p(t, 8.2, 8.8));
      set(card, c, (1 - c) * 80);
      S.rows.forEach((_, i) => { $(`ir${i}`).style.opacity = eo(p(t, 8.9 + i * 0.22, 9.3 + i * 0.22)); });
      $('itot').style.opacity = eo(p(t, 10.4, 10.8));
      $('bexport').style.transform = t >= 12.0 && t < 12.2 ? 'scale(0.93)' : 'scale(1)';
      moveCursor(t, [[11.0, 600, 1300], [12.0, 820, 492], [13.2, 900, 620]], [12.0], t >= 11.0 && t < 13.2);
      const f = eo(p(t, 12.4, 12.9));
      set(file, f, (1 - f) * 40, 0.9 + f * 0.1);
      revealWords(outro.firstChild, t, 13.3, 0.06);
      endcard(t, END);
    }};
  }

  /* ============================ 8 kolejnych historii: wspólny schemat ====== */
  // hak (0–3 s) → problem na ciemnym tle (3–7,7 s) → rozwiązanie w Pointhours na jasnym tle → plansza końcowa.
  // Elementy .pv pojawiają się po kolei w scenie problemu, .rv w karcie rozwiązania, .hlrow podświetla się
  // po wszystkich .rv, #click to przycisk klikany kursorem, a .after pojawia się po kliknięciu.
  const C = { task: 'var(--task)', review: 'var(--review)', pair: 'var(--pair)', meeting: 'var(--meeting)', extra: 'var(--extra)' };
  const whiteRow = (l, r, extra = '') => `<div class="pv" style="background:#fff;color:var(--text);border-radius:22px;padding:22px 28px;font-size:32px;font-weight:650;display:flex;justify-content:space-between;gap:20px;${extra}"><span>${l}</span><span style="color:var(--soft);font-weight:500;white-space:nowrap">${r}</span></div>`;
  const inkCard = html => `<div class="pv dark-card" style="padding:30px 34px">${html}</div>`;
  const solCard = (head, meta, body) => `<div class="card" style="padding:38px 42px 30px"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:20px"><span class="h" style="font-size:44px">${head}</span><span class="muted" style="font-size:27px;white-space:nowrap">${meta}</span></div><div style="margin-top:18px">${body}</div></div>`;
  const solRow = (color, l, r, cls = 'rv') => `<div class="${cls}" style="display:flex;align-items:center;gap:18px;padding:17px 12px;border-top:2px solid var(--line);font-size:31px"><span class="dot" style="background:${color}"></span><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l}</span><span style="font-weight:700;white-space:nowrap">${r}</span></div>`;
  const rowsOf = (rows, colors, hlLast = true) => rows.map((r, i) => solRow(colors[i % colors.length], r[0], r[1], hlLast && i === rows.length - 1 ? 'rv hlrow' : 'rv')).join('');
  const field = (label, value, style = '') => `<div class="rv" style="${style}"><div style="font-size:24px;font-weight:650;margin-bottom:8px">${label}</div><div style="border:2px solid #cfd3e1;border-radius:14px;padding:14px 18px;font-size:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${value}</div></div>`;

  const VIS = {
    review: S => ({
      problem: inkCard(`<div style="font-size:28px;color:var(--on-ink-soft)">${S.board}</div><div class="display" style="font-size:110px;margin-top:8px">0</div>`) + S.mrs.map(m => whiteRow(m[0], m[1])).join(''),
      solution: solCard(S.head, S.meta, rowsOf(S.rows, [C.review])),
    }),
    pairing: S => ({
      problem: inkCard(`<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:28px;color:var(--on-ink-soft)">${S.ticket}</div><div class="display" style="font-size:110px;margin-top:8px;color:#ff7aa8">${S.doubled}</div></div><div style="display:flex"><span style="width:110px;height:110px;border-radius:50%;background:var(--task);display:grid;place-items:center;font-size:48px;font-weight:800">A</span><span style="width:110px;height:110px;border-radius:50%;background:var(--pair);display:grid;place-items:center;font-size:48px;font-weight:800;margin-left:-26px;border:6px solid var(--ink-2)">K</span></div></div>`) + whiteRow(S.you, '2 h') + whiteRow(S.helper, '2 h'),
      solution: solCard(S.head, S.meta, S.rows.map((r, i) => solRow([C.task, C.pair, C.review, C.pair][i], r[0], r[1], i === 1 ? 'rv hlrow' : 'rv')).join('')),
    }),
    meetings: S => {
      const blocks = [[0, 4, 14, 0], [0, 46, 9, -1], [1, 10, 12, 1], [1, 58, 16, -1], [2, 6, 8, -1], [2, 30, 12, 2], [3, 14, 24, 3], [3, 62, 9, -1], [4, 18, 11, 4], [4, 46, 16, 5]];
      return {
        problem: `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">${S.days.map(d => `<div style="text-align:center;font-weight:700;font-size:28px;color:var(--on-ink-soft)">${d}</div>`).join('')}</div>
          <div style="position:relative;height:560px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px">${S.days.map(() => '<div style="background:var(--ink-2);border-radius:16px"></div>').join('')}
          ${blocks.map(([d, top, h, label]) => `<div class="pv" style="position:absolute;left:calc(${d} * (100% - 48px) / 5 + ${d * 12}px);width:calc((100% - 48px) / 5);top:${top}%;height:${h}%;background:${label === -1 ? '#4a4e69' : '#7d7bf7'};border-radius:12px;padding:8px 10px;font-size:22px;font-weight:700;overflow:hidden">${label === -1 ? '' : S.blocks[label]}</div>`).join('')}</div>`,
        solution: solCard(S.head, S.meta, S.rows.map((r, i) => solRow([C.task, C.meeting, C.review, C.pair][i], r[0], r[1], i === 1 ? 'rv hlrow' : 'rv')).join('')),
      };
    },
    extra: S => ({
      problem: S.asks.map(([who, msg], i) => `<div class="pv" style="align-self:${i % 2 ? 'flex-end' : 'flex-start'};max-width:780px;background:#fff;color:var(--text);border-radius:28px;${i % 2 ? 'border-bottom-right-radius:8px' : 'border-bottom-left-radius:8px'};padding:22px 30px;box-shadow:0 24px 50px -30px rgba(0,0,0,0.7)"><div style="font-size:24px;font-weight:700;color:var(--extra)">${who}</div><div style="font-size:36px;font-weight:650;margin-top:4px">${msg}</div></div>`).join(''),
      solution: solCard(S.head, S.meta, rowsOf(S.rows, [C.extra])),
    }),
    estimate: S => ({
      problem: `<div style="display:flex;gap:18px;justify-content:center;padding:30px 0">${['3', '5', '8', '13', '?'].map((v, i) => `<div class="pv" style="width:150px;height:220px;border-radius:20px;background:#fff;color:var(--text);display:grid;place-items:center;font-family:'Brand Display';font-weight:780;font-size:90px;rotate:${[-8, -3, 2, 6, 10][i]}deg;${v === '?' ? 'background:var(--review);color:#3b2600' : ''}">${v}</div>`).join('')}</div>`,
      solution: solCard(S.head, S.meta, rowsOf(S.rows, [C.task])),
    }),
    forgot: S => ({
      problem: inkCard(`<div style="display:flex;align-items:center;gap:26px"><div class="play" style="background:#4a4e69"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="#b3b7cc"/></svg></div><div style="flex:1;min-width:0"><div class="t-state">${S.notStarted}</div><div class="t-name" style="color:#b3b7cc">${S.task}</div></div><div class="clock" style="color:#7d81a0">00:00:00</div></div>`)
        + `<div class="pv" style="height:90px;border-radius:18px;background:repeating-linear-gradient(90deg, #2a2d4d 0, #2a2d4d calc(12.5% - 3px), #14162b calc(12.5% - 3px), #14162b 12.5%);display:grid;place-items:center;font-size:34px;font-weight:800;color:#ff7aa8;border:3px dashed #ff7aa8">${S.missing}</div>`,
      solution: solCard(S.head, S.meta, `<div style="display:flex;flex-direction:column;gap:18px">
          <div class="rv" style="display:flex;gap:12px">${S.types.map((x, i) => `<span class="chip" style="font-size:26px;padding:10px 22px 10px 12px;${i === 0 ? 'background:var(--ink);color:#fff;border-color:var(--ink)' : ''}"><i style="background:${[C.task, C.review, C.meeting][i]};width:28px;height:28px"></i>${x}</span>`).join('')}</div>
          ${S.fields.map(f => field(f[0], f[1])).join('')}
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px">${field(S.from[0], S.from[1])}${field(S.to[0], S.to[1])}${field(S.sp, '5')}</div>
          <div class="rv" style="display:flex;justify-content:space-between;align-items:center;gap:16px"><span class="chip after" style="font-size:26px;padding:10px 22px 10px 12px"><i style="background:var(--pair)">✓</i>${S.saved}</span><span class="btn" id="click" style="background:var(--ink);color:#fff">${S.save}</span></div></div>`),
      click: true,
    }),
    templates: S => ({
      problem: S.days.map(d => whiteRow(`${d} · ${S.entry}`, '15 min', 'padding:18px 28px')).join(''),
      solution: solCard(S.head, S.meta, `<div style="display:flex;flex-wrap:wrap;gap:14px;padding:6px 0 22px">${S.chips.map((c, i) => `<span class="chip rv" ${i === 0 ? 'id="click"' : ''} style="font-size:28px"><i style="background:${[C.meeting, C.review, C.meeting, C.meeting][i]}">+</i>${c}</span>`).join('')}</div>
          <div class="after">${solRow(C.meeting, S.added[0], S.added[1], '')}</div>
          <div class="after" style="padding-top:18px"><span class="chip" style="font-size:26px;padding:10px 22px 10px 12px"><i style="background:var(--pair)">✓</i>${S.toast}</span></div>`),
      click: true,
    }),
    summary: S => ({
      problem: `<div class="pv" style="background:#fff;color:var(--text);border-radius:24px;padding:28px 30px"><div style="font-size:26px;color:var(--soft);font-weight:600">PAY-142 · ${S.comment}</div><div style="margin-top:14px;border:2px solid #cfd3e1;border-radius:16px;height:150px;padding:20px 22px;font-size:34px">${S.timeSpent} <span style="color:var(--alert);font-weight:800">?</span></div></div>`
        + S.notes.map((n, i) => `<div class="pv" style="align-self:flex-start;background:#ffe58a;color:#3b2f00;border-radius:12px;padding:16px 24px;font-size:32px;font-family:'Comic Sans MS',cursive;rotate:${[-3, 2, -1][i]}deg;margin-left:${[0, 120, 40][i]}px">${n}</div>`).join(''),
      solution: solCard(S.head, S.meta, `<div style="display:flex;flex-direction:column;gap:12px;border-left:6px solid var(--task);padding:6px 0 6px 22px;margin:8px 0 22px">${S.lines.map(l => `<div class="rv" style="font-size:31px;line-height:1.3">${l.replace(/(\d) (h|min|SP)/g, '$1\u00a0$2')}</div>`).join('')}</div>
          <div class="rv" style="display:flex;justify-content:space-between;align-items:center;gap:16px"><span class="chip after" style="font-size:26px;padding:10px 22px 10px 12px"><i style="background:var(--pair)">✓</i>${S.copied}</span><span class="btn" id="click" style="background:var(--ink);color:#fff">⧉ ${S.copy}</span></div>`),
      click: true,
    }),
  };

  function generic(name) {
    const V = VIS[name](S);
    const kicker = add(ink, `<p class="kicker">${S.kicker}</p>`, 'left:64px;top:470px;right:120px');
    const h1 = add(ink, `<p class="display big">${words(S.hook1)}</p>`, 'left:64px;top:560px;right:110px');
    const h2 = add(ink, `<p class="display big hl-review">${words(S.hook2)}</p>`, 'left:64px;top:900px;right:110px');
    const prob = add(ink, `${V.problem}<p class="display mid" id="p1" style="margin-top:20px">${words(S.p1)}</p><p class="display mid hl-extra" id="p2">${words(S.p2)}</p>`,
      'left:64px;top:280px;right:120px;display:flex;flex-direction:column;gap:22px');
    const sol = add(paper, `<h2 class="display ink-text" id="cap" style="font-size:88px">${words(S.caption)}</h2>${V.solution}
      ${S.stat ? `<div id="stat" style="display:flex;align-items:baseline;gap:22px;flex-wrap:wrap"><span class="display" style="font-size:112px;color:var(--text)">${S.stat}</span><span style="font-size:38px;color:var(--soft);font-weight:600">${S.statLabel}</span></div>` : ''}
      <p class="display" id="outro" style="font-size:56px;color:var(--text)">${words(S.outro)}</p>`,
      'left:64px;top:220px;width:876px;display:flex;flex-direction:column;gap:36px');

    const pv = [...prob.querySelectorAll('.pv')], step = Math.min(0.25, 1.3 / Math.max(1, pv.length));
    const rv = [...sol.querySelectorAll('.rv')], rStep = Math.min(0.32, 2.4 / Math.max(1, rv.length));
    const afters = [...sol.querySelectorAll('.after')], hl = [...sol.querySelectorAll('.hlrow')];
    const card = sol.querySelector('.card'), click = sol.querySelector('#click'), stat = sol.querySelector('#stat');
    const pAt = 3.15 + pv.length * step + 0.3;
    const rowsEnd = 8.8 + rv.length * rStep, hlAt = rowsEnd + 0.3;
    const clickAt = V.click ? rowsEnd + 0.7 : null;
    const statAt = clickAt ? clickAt + 0.5 + afters.length * 0.3 : rowsEnd + 0.5;
    const outroAt = statAt + (stat ? 0.8 : 0);
    const END = Math.max(16.4, outroAt + 2.6);
    let target = null, placed = false;

    return { duration: Math.ceil(END + 4.6), frame(t) {
      if (!placed) { h2.style.top = `${560 + h1.offsetHeight + 56}px`; placed = true; }
      set(kicker, vis(t, 0.05, 3.0), 0);
      revealWords(h1.firstChild, t, 0.15); h1.style.opacity = 1 - p(t, 2.7, 3.0);
      revealWords(h2.firstChild, t, 1.0); h2.style.opacity = 1 - p(t, 2.7, 3.0);

      prob.style.opacity = vis(t, 3.0, 7.7);
      pv.forEach((e, i) => { const k = eo(p(t, 3.15 + i * step, 3.55 + i * step)); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 50}px)`; });
      revealWords($('p1'), t, pAt, 0.06); revealWords($('p2'), t, pAt + 1.1, 0.06);

      paperIn(t, 7.5);
      revealWords($('cap'), t, 7.9);
      const c = eo(p(t, 8.1, 8.6));
      set(card, c, (1 - c) * 80);
      rv.forEach((e, i) => { const k = eo(p(t, 8.8 + i * rStep, 9.2 + i * rStep)); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 24}px)`; });
      hl.forEach(e => e.classList.toggle('lit', t >= hlAt));
      afters.forEach((e, i) => { const k = clickAt === null ? 1 : eo(p(t, clickAt + 0.3 + i * 0.3, clickAt + 0.7 + i * 0.3)); e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * 20}px)`; });
      if (click) {
        click.style.transform = t >= clickAt && t < clickAt + 0.15 ? 'scale(0.93)' : 'scale(1)';
        if (t >= clickAt - 1.1 && !target) { const r = click.getBoundingClientRect(); target = [r.left + r.width * 0.55, r.top + r.height * 0.55]; }
        moveCursor(t, target ? [[clickAt - 1.0, 760, 1560], [clickAt, target[0], target[1]], [clickAt + 0.9, target[0] + 90, target[1] + 160]] : [[0, 0, 0]], [clickAt], target && t >= clickAt - 1.0 && t < clickAt + 0.9);
      }
      if (stat) { const s = eo(p(t, statAt, statAt + 0.5)); set(stat, s, (1 - s) * 40); }
      revealWords($('outro'), t, outroAt, 0.06);
      endcard(t, END);
    }};
  }

  const story = ({ sprint, pause, invoice })[STORY]?.() ?? generic(STORY);
  window.DURATION = story.duration;
  window.render = t => story.frame(t);
  window.__ready = document.fonts.ready.then(() => { story.frame(0); return true; });

  if (params.has('play')) {
    let start = performance.now();
    const loop = now => {
      const t = ((now - start) / 1000) % story.duration;
      story.frame(t);
      requestAnimationFrame(loop);
    };
    window.__ready.then(() => requestAnimationFrame(loop));
  }
})();
</script>
</body>
</html>
