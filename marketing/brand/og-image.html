<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splits OG image</title>
<!--
  Szablon obrazu Open Graph (1200x630) i ikon. Renderowany przez marketing/brand/render.py.
  Używa tych samych fontów co aplikacja (src/assets/fonts).
-->
<style>
  @font-face { font-family: 'Brand Display'; src: url('../../src/assets/fonts/brand-display-core.woff2') format('woff2'); font-weight: 600 800; }
  @font-face { font-family: 'Brand Text'; src: url('../../src/assets/fonts/brand-text-core.woff2') format('woff2'); font-weight: 400 700; }
  :root {
    --ink: #14162b; --paper: #f5f6fa; --soft: #b3b7cc;
    --task: #3d3bf3; --review: #e8a33d; --pair: #0f9f86; --extra: #db4a7c; --meeting: #8a8fa8;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  body { width: 1200px; height: 630px; background: var(--ink); color: #fff; font-family: 'Brand Text', sans-serif; overflow: hidden; }
  .og { position: relative; width: 100%; height: 100%; padding: 64px 72px; display: flex; flex-direction: column; }
  .logo { display: flex; align-items: center; gap: 14px; }
  .mark { width: 52px; height: 52px; display: block; }
  .word { font-family: 'Brand Display'; font-weight: 780; font-size: 40px; letter-spacing: -0.03em; line-height: 1; }
  h1 { font-family: 'Brand Display'; font-weight: 760; font-size: 96px; line-height: 0.95; letter-spacing: -0.02em; margin-top: 54px; max-width: 900px; }
  p { margin-top: 26px; font-size: 30px; color: var(--soft); }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 22px; display: flex; gap: 4px; }
  .strip span { display: block; height: 100%; }
  .icon { width: 512px; height: 512px; background: var(--ink); display: grid; place-items: center; }
  .icon .mark { width: 330px; height: 330px; }
  .icon.maskable .mark { width: 250px; height: 250px; }
</style>
</head>
<body>
  <div class="og" id="og">
    <div class="logo">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="13" y="1.5" width="6" height="3.2" rx="1.3" fill="#fff"/><rect x="15" y="3.8" width="2" height="3.6" fill="#fff"/><g transform="rotate(-90 16 18)" fill="none" stroke-width="4.2"><circle cx="16" cy="18" r="11" stroke="var(--task)" stroke-dasharray="25.33 69.115" stroke-dashoffset="-1.1"/><circle cx="16" cy="18" r="11" stroke="var(--review)" stroke-dasharray="9.65 69.115" stroke-dashoffset="-28.63"/><circle cx="16" cy="18" r="11" stroke="var(--pair)" stroke-dasharray="15.68 69.115" stroke-dashoffset="-40.48"/><circle cx="16" cy="18" r="11" stroke="var(--extra)" stroke-dasharray="9.65 69.115" stroke-dashoffset="-58.36"/></g><path d="M16 18 L19.9 13.4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="18" r="1.9" fill="#fff"/></svg>
      <div class="word">splits</div>
    </div>
    <h1 id="og-title">Code reviews ate your sprint. Now you can prove it.</h1>
    <p id="og-text">The time tracker for developers: tasks, code reviews, sprints.</p>
    <div class="strip">
      <span style="width:30%;background:var(--task)"></span><span style="width:9%;background:var(--review)"></span><span style="width:16%;background:var(--pair)"></span><span style="width:7%;background:var(--extra)"></span><span style="width:12%;background:var(--meeting)"></span><span style="width:26%;background:var(--task)"></span>
    </div>
  </div>
  <div class="icon" id="icon" hidden>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="13" y="1.5" width="6" height="3.2" rx="1.3" fill="#fff"/><rect x="15" y="3.8" width="2" height="3.6" fill="#fff"/><g transform="rotate(-90 16 18)" fill="none" stroke-width="4.2"><circle cx="16" cy="18" r="11" stroke="var(--task)" stroke-dasharray="25.33 69.115" stroke-dashoffset="-1.1"/><circle cx="16" cy="18" r="11" stroke="var(--review)" stroke-dasharray="9.65 69.115" stroke-dashoffset="-28.63"/><circle cx="16" cy="18" r="11" stroke="var(--pair)" stroke-dasharray="15.68 69.115" stroke-dashoffset="-40.48"/><circle cx="16" cy="18" r="11" stroke="var(--extra)" stroke-dasharray="9.65 69.115" stroke-dashoffset="-58.36"/></g><path d="M16 18 L19.9 13.4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="16" cy="18" r="1.9" fill="#fff"/></svg>
  </div>
<script>
  // ?lang=pl → wersja polska (og-pl.png)
  if (new URLSearchParams(location.search).get('lang') === 'pl') {
    document.documentElement.lang = 'pl';
    document.getElementById('og-title').textContent = 'Code review zjadło Ci sprint. Teraz to udowodnisz.';
    document.getElementById('og-text').textContent = 'Time tracker dla programistów: zadania, Code Review, sprinty.';
  }
</script>
</body>
</html>
