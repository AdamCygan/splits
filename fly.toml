# ---------------------------------------------------------------------------
# Pointhours na Fly.io: jedna aplikacja (strony + API), region Frankfurt, baza na Neonie.
#
#   fly apps create <nazwa>                    # tylko za pierwszym razem; tę samą nazwę wpisz w `app` niżej
#   fly secrets set DATABASE_URL="postgresql://…neon.tech/neondb?sslmode=verify-full" \
#                   JWT_SECRET="$(openssl rand -base64 48)"
#   fly deploy --ha=false
#
# Sekrety (hasła, klucze) tylko przez `fly secrets set`, nigdy w tym pliku.
# ---------------------------------------------------------------------------
app = 'pointhours'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    # Publiczne (trafiają do przeglądarki): domena strony i klucz PostHog (phc_…, pusty = bez statystyk).
    VITE_APP_URL = 'https://pointhours.com'
    VITE_POSTHOG_KEY = ''

[env]
  APP_URL = 'https://pointhours.com'
  EMAIL_FROM = 'Pointhours <no-reply@pointhours.com>'
  # Fly ustawia adres klienta w Fly-Client-IP (limity prób logowania).
  CLIENT_IP_HEADER = 'fly-client-ip'

[http_service]
  internal_port = 3000
  force_https = true
  # Jedna maszyna działa zawsze: landing i Google nie czekają na zimny start.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/api/v1/health'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
